[project]
name = "aussiebb-mcp"
version = "0.2.0"
description = "MCP server for Aussie Broadband NBN diagnostics via the (unofficial) MyAussie API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "aussie-broadband", "nbn", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # The kit pins the MCP SDK range (mcp<2) for every server built on it.
    "mcp-server-kit>=0.1,<0.2",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/snickery/aussiebb-mcp"
Issues = "https://github.com/snickery/aussiebb-mcp/issues"

[project.scripts]
aussiebb-mcp = "aussiebb_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aussiebb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
