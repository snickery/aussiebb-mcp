name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no stored token.
# Fires on a published GitHub release, or manually via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish
